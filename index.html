<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Foot">
<title>Coach Foot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#eef2ec; --card:#fff; --ink:#13241b; --muted:#6a7a70; --line:#dfe6df;
  --pitch:#0f6b42; --dark:#0b3b27; --accent:#d6f43a; --accent-ink:#1d2a05;
  --red:#d6453d; --gold:#f2b632; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header.top{position:sticky;top:0;z-index:20;color:#fff;padding:calc(14px + var(--safe-t)) 18px 14px;
  background:repeating-linear-gradient(90deg,#0d4630 0 38px,#0b3b27 38px 76px);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .row{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:12px;font-weight:600;opacity:.75;letter-spacing:.5px;text-transform:uppercase}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.12);color:#fff}
main{max-width:720px;margin:0 auto;padding:16px 14px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--pitch);background:#e6f2ea}
h2{font-size:18px;margin:22px 4px 10px;font-weight:800}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--pitch),var(--dark));color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:3px solid rgba(255,255,255,.12);border-radius:50%}
.hero h3{margin:0 0 4px;font-size:20px}
.hero p{margin:0 0 14px;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:800;background:var(--pitch);color:#fff}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:#e9efe9;color:var(--ink)}
.btn.red{background:#fbe7e5;color:var(--red)}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pitch)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;background:#dfe7df;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:800;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 6px}
input.in,select.in,textarea.in{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pitch)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 12px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.exo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.exo .ico{width:44px;height:44px;border-radius:12px;background:#e8f1ea;display:grid;place-items:center;font-size:22px;flex:none}
.exo .tx{flex:1;min-width:0}
.exo .tx b{display:block;font-size:15.5px}
.exo .tx span{font-size:13px;color:var(--muted)}
.exo .side{font-size:13px;font-weight:800;color:var(--pitch);white-space:nowrap}
.star{font-size:20px;color:#c9d2ca}.star.on{color:var(--gold)}
.bloc{display:flex;gap:10px;align-items:stretch;background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden}
.bloc .time{background:var(--dark);color:var(--accent);font-weight:800;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;flex:none}
.bloc .time small{font-size:10px;color:#fff;opacity:.7;font-weight:600}
.bloc .tx{flex:1;padding:10px 0;min-width:0;text-align:left}
.bloc .tx b{display:block}
.bloc .tx span{font-size:13px;color:var(--muted)}
.bloc .acts{display:flex;align-items:center;gap:2px;padding-right:6px}
.bloc .acts button{width:34px;height:34px;border-radius:10px;font-size:16px;color:var(--muted)}
.bloc .acts button:active{background:#eef2ec}
.sess{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;position:relative}
.sess .d{font-size:12px;font-weight:800;color:var(--pitch);text-transform:uppercase;letter-spacing:.4px}
.sess b{display:block;font-size:16px;margin:2px 0}
.sess span{font-size:13px;color:var(--muted)}
.sess .tag{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:#fff6d6;color:#8a6500}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty div{font-size:44px;margin-bottom:6px}
.player{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--dark);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.player .tx{flex:1;min-width:0}
.player .tx b{display:block}
.player .tx span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:#e6ece6;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--pitch)}
.pres{display:flex;flex-wrap:wrap;gap:8px}
.pres button{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.pres button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.rating button{font-size:30px;color:#cfd6d0;padding:0 2px}.rating button.on{color:var(--gold)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(5,20,12,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--safe-b));animation:up .22s ease}
.sheet.full{max-height:100vh;height:100%;border-radius:0;padding-top:calc(8px + var(--safe-t))}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:#c8d1c9;margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:sticky;top:-8px;background:var(--bg);padding:8px 0;z-index:2}
.sh-head h3{flex:1;margin:0;font-size:19px}
.closebtn{width:38px;height:38px;border-radius:50%;background:#dfe6df;font-size:18px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.meta span{background:#fff;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700}
.sec{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--pitch)}
.sec p{margin:0}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.pitch-svg{width:100%;border-radius:14px;display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:25;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.draftbar{position:fixed;left:14px;right:14px;bottom:calc(80px + var(--safe-b));z-index:24;max-width:692px;margin:0 auto;background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.draftbar div{flex:1;font-size:14px}
.draftbar b{color:var(--accent)}
.toprow{display:flex;gap:8px;align-items:center}
.small{font-size:13px;color:var(--muted)}
.themebars .r{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.themebars .r b{width:110px;font-weight:700}
.themebars .r .bar{flex:1;margin:0;height:10px}
.themebars .r i{background:linear-gradient(90deg,var(--pitch),#3aa66f)}
</style>
</head>
<body>
<header class="top"><div class="row">
  <div style="flex:1;min-width:0"><small id="hClub">Mon équipe</small><h1 id="hTitle">Coach Foot</h1></div>
  <span class="badge" id="hCat">U11</span>
  <button class="iconbtn" id="btnSettings" aria-label="Réglages">⚙️</button>
</div></header>

<main id="view"></main>
<div id="draftbar"></div>

<nav class="tabs">
  <button data-tab="accueil" class="on"><span>🏠</span>Accueil</button>
  <button data-tab="idees"><span>💡</span>Idées</button>
  <button data-tab="seances"><span>📋</span>Séances</button>
  <button data-tab="effectif"><span>👥</span>Effectif</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="exos.js?v=1"></script>
<script>
// ================== STOCKAGE ==================
const KEY = "coachfoot-v1";
const defaultState = () => ({
  settings:{club:"", equipe:"Mon équipe", cat:2, duree:90},
  joueurs:[], seances:[], favoris:[], records:{}, draft:null, gen:null
});
let S;
try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(KEY)||"{}")); } catch(e){ S = defaultState(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ================== OUTILS ==================
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); };
const fmtLong = iso => { const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); };
const exoById = id => EXOS.find(e=>e.id===id);
const rand = a => a[Math.floor(Math.random()*a.length)];
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }
const okCat = e => S.settings.cat>=e.min && S.settings.cat<=e.max;
const initials = n => n.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();

// ================== EN-TÊTE ==================
function renderHeader(){
  $("#hClub").textContent = S.settings.club || "Coach Foot";
  $("#hTitle").textContent = S.settings.equipe || "Mon équipe";
  $("#hCat").textContent = CATS[S.settings.cat];
}

// ================== NAVIGATION ==================
let tab = "accueil", ideesMode = "gen", filt = {type:"", theme:"", q:"", fav:false}, seanceFiltre="toutes";
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function go(t){ tab=t; document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t)); render(); window.scrollTo(0,0); }
function render(){
  renderHeader();
  ({accueil:vAccueil, idees:vIdees, seances:vSeances, effectif:vEffectif})[tab]();
  renderDraftBar();
}

// ================== ACCUEIL ==================
function vAccueil(){
  const t=today();
  const passees = S.seances.filter(s=>s.date<=t).sort((a,b)=>b.date.localeCompare(a.date));
  const futures = S.seances.filter(s=>s.date>t).sort((a,b)=>a.date.localeCompare(b.date));
  const now=new Date(), mois=now.toISOString().slice(0,7);
  const ceMois = passees.filter(s=>s.date.startsWith(mois)).length;
  const pres = presenceMoyenne();
  const minutes = passees.reduce((a,s)=>a+dureeSeance(s),0);
  // thèmes travaillés
  const cnt={}; passees.forEach(s=>s.blocs.forEach(b=>{const e=exoById(b.exId); if(e) e.th.forEach(x=>cnt[x]=(cnt[x]||0)+1);}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5); const mx=top.length?top[0][1]:1;
  const prochaine = futures[0] || passees.find(s=>s.date===t);
  let h = `
  <div class="card hero">
    <h3>${prochaine ? "Prochaine séance" : "Prêt pour l'entraînement ?"}</h3>
    <p>${prochaine ? esc(fmtLong(prochaine.date))+" · "+esc(prochaine.theme||"Séance")+" · "+dureeSeance(prochaine)+" min" : "Génère une séance complète adaptée à tes "+CATS[S.settings.cat]+" en un clic."}</p>
    <div class="toprow">
      ${prochaine ? `<button class="btn acc" onclick="openSeance('${prochaine.id}')">Voir la séance</button>` : ""}
      <button class="btn ${prochaine?"ghost":"acc"}" onclick="ideesMode='gen';go('idees')">⚡ Générer une séance</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b>${ceMois}</b><span>séances ce mois</span></div>
    <div class="stat"><b>${pres===null?"–":pres+"%"}</b><span>présence moy.</span></div>
    <div class="stat"><b>${Math.round(minutes/60)}h</b><span>d'entraînement</span></div>
  </div>`;
  if(top.length){
    h += `<h2>Thèmes les plus travaillés</h2><div class="card themebars">`+
      top.map(([k,v])=>`<div class="r"><b>${esc(k)}</b><div class="bar"><i style="width:${Math.round(v/mx*100)}%"></i></div><span class="small">${v}</span></div>`).join("")+`</div>`;
  }
  h += `<h2>Dernières séances</h2>`;
  h += passees.length ? passees.slice(0,3).map(sessCard).join("") :
    `<div class="card empty"><div>📋</div>Aucune séance enregistrée.<br>Commence par en générer une !</div>`;
  h += `<h2>Idée d'exercice du jour</h2>`;
  const pool = EXOS.filter(e=>okCat(e) && ["technique","situation","finition"].includes(e.type));
  const dj = pool[(new Date().getDate()*7) % pool.length];
  if(dj) h += exoRow(dj);
  $("#view").innerHTML = h;
}

// ================== IDÉES ==================
function vIdees(){
  let h = `<div class="seg"><button class="${ideesMode==="gen"?"on":""}" onclick="ideesMode='gen';render()">⚡ Générer une séance</button><button class="${ideesMode==="lib"?"on":""}" onclick="ideesMode='lib';render()">📚 Exercices</button></div>`;
  h += ideesMode==="gen" ? genView() : libView();
  $("#view").innerHTML = h;
  if(ideesMode==="lib"){ const q=$("#q"); if(q){ q.oninput=()=>{filt.q=q.value; $("#libList").innerHTML=libList();}; } }
}
function genView(){
  const g = S.gen || {theme:"", duree:S.settings.duree, nb:12};
  let h = `<div class="card">
    <label class="f" style="margin-top:0">Thème principal</label>
    <select class="in" id="gTheme"><option value="">🎲 Au hasard</option>${THEMES.map(t=>`<option ${g.theme===t?"selected":""}>${t}</option>`).join("")}</select>
    <div class="grid2">
      <div><label class="f">Durée</label><select class="in" id="gDuree">${[45,60,75,90,105,120].map(d=>`<option value="${d}" ${+g.duree===d?"selected":""}>${d} min</option>`).join("")}</select></div>
      <div><label class="f">Joueurs présents</label><input class="in" id="gNb" type="number" min="2" max="30" value="${g.nb||12}"></div>
    </div>
    <button class="btn acc full" style="margin-top:14px" onclick="generer()">⚡ ${g.blocs?"Générer une autre séance":"Générer ma séance"}</button>
  </div>`;
  if(g.blocs){
    const tot = g.blocs.reduce((a,b)=>a+(+b.duree||0),0);
    h += `<h2>Séance « ${esc(g.themeChoisi)} » · ${tot} min</h2>`;
    h += g.blocs.map((b,i)=>blocRow(b,i,"gen")).join("");
    h += `<p class="small" style="margin:4px 4px 12px">Touche un exercice pour voir le détail. 🔄 pour le remplacer.</p>
      <button class="btn full" onclick="genToDraft()">💾 Enregistrer / planifier cette séance</button>`;
  }
  return h;
}
function generer(){
  const theme = $("#gTheme").value, duree=+$("#gDuree").value, nb=+$("#gNb").value||12;
  const themeChoisi = theme || rand(THEMES.filter(t=>t!=="Coordination"));
  const structure = [["echauffement",.15],["technique",.22],["situation",.25],["match",.3],["calme",.08]];
  const blocs = [];
  structure.forEach(([type,part])=>{
    const ex = pickExo(type, themeChoisi, nb, blocs.map(b=>b.exId));
    if(ex) blocs.push({exId:ex.id, titre:ex.t, duree:Math.max(5, Math.round(duree*part/5)*5)});
  });
  // ajuster pour tomber pile sur la durée
  const tot = blocs.reduce((a,b)=>a+b.duree,0); const m = blocs.find(b=>exoById(b.exId).type==="match");
  if(m) m.duree = Math.max(10, m.duree + (duree-tot));
  S.gen = {theme, duree, nb, themeChoisi, blocs}; save(); render();
}
function nbOk(e,nb){ const [a,b]=e.j.split("-").map(Number); return nb>=a; }
function pickExo(type, theme, nb, exclude){
  let pool = EXOS.filter(e=>e.type===type && okCat(e) && !exclude.includes(e.id));
  const fit = pool.filter(e=>nbOk(e,nb));
  if(fit.length) pool = fit;
  const th = pool.filter(e=>e.th.includes(theme));
  return rand(th.length ? th : pool) || null;
}
function swapBloc(i, where){
  const list = where==="gen" ? S.gen.blocs : S.draft.blocs;
  const cur = exoById(list[i].exId); if(!cur) return toast("Bloc personnalisé : modifie-le directement");
  const theme = where==="gen" ? S.gen.themeChoisi : (S.draft.theme||"");
  const ex = pickExo(cur.type, theme, where==="gen"?S.gen.nb:99, list.map(b=>b.exId));
  if(!ex) return toast("Pas d'autre exercice de ce type pour cette catégorie");
  list[i] = {exId:ex.id, titre:ex.t, duree:list[i].duree};
  save(); where==="gen" ? render() : renderEditor();
}
function genToDraft(){
  const g=S.gen;
  S.draft = {id:null, date:today(), theme:g.themeChoisi, blocs:g.blocs.map(b=>({...b})), presents:[], note:0, comm:"", objectif:""};
  save(); openEditor();
}
function libView(){
  return `<input class="in" id="q" placeholder="🔍 Rechercher un exercice…" value="${esc(filt.q)}">
  <div class="chips" style="margin-top:10px">
    <button class="chip ${!filt.type&&!filt.fav?"on":""}" onclick="filt.type='';filt.fav=false;render()">Tous</button>
    <button class="chip ${filt.fav?"on":""}" onclick="filt.fav=!filt.fav;render()">⭐ Favoris</button>

function blocRow(b,i,where){

// ---------- schéma terrain simple ----------
function pitchSVG(e){
  const c = {echauffement:"#f2b632",technique:"#d6f43a",situation:"#ffffff",finition:"#ff8a65",physique:"#7fd3ff",match:"#ffffff",gardien:"#ffd54f",calme:"#b2dfdb"}[e.type];
  const seed = e.id.split("").reduce((a,ch)=>a+ch.charCodeAt(0),0);
  let r = n => { const x=Math.sin(seed*99+n*13.7)*10000; return x-Math.floor(x); };
  let dots=""; const n= Math.min(10, +e.j.split("-")[0] + 3);
  for(let i=0;i<n;i++){ const x=40+r(i)*240, y=25+r(i+50)*110; dots+=`<circle cx="${x}" cy="${y}" r="7" fill="${i%2?c:"#0b3b27"}" stroke="#fff" stroke-width="2"/>`; }
  const goals = ["finition","match","situation","gardien"].includes(e.type);
  return `<svg class="pitch-svg" viewBox="0 0 320 160" role="img" aria-label="Schéma du terrain">
    <defs><pattern id="st" width="40" height="160" patternUnits="userSpaceOnUse"><rect width="20" height="160" fill="#14774a"/><rect x="20" width="20" height="160" fill="#118045"/></pattern></defs>
    <rect width="320" height="160" fill="url(#st)"/>
    <rect x="12" y="10" width="296" height="140" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
    <line x1="160" y1="10" x2="160" y2="150" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="160" cy="80" r="22" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    ${goals?`<rect x="4" y="62" width="8" height="36" fill="#fff"/><rect x="308" y="62" width="8" height="36" fill="#fff"/>`:`<g fill="#ff8a00">${[0,1,2,3].map(i=>`<polygon points="${60+i*65},140 ${66+i*65},128 ${72+i*65},140"/>`).join("")}</g>`}
    ${dots}<circle cx="${60+r(7)*200}" cy="${40+r(8)*80}" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
  </svg>`;
}

    <span>${s.blocs.length} exercice${s.blocs.length>1?"s":""} · ${dureeSeance(s)} min${nbP?` · ${nbP} présent${nbP>1?"s":""}`:""}</span></button>`;
}
function vSeances(){
  const t=today();
  let l=[...S.seances].sort((a,b)=>b.date.localeCompare(a.date));
  if(seanceFiltre==="avenir") l=l.filter(s=>s.date>t).reverse();
  if(seanceFiltre==="passees") l=l.filter(s=>s.date<=t);
  let h = `<div class="chips"><button class="chip ${seanceFiltre==="toutes"?"on":""}" onclick="seanceFiltre='toutes';render()">Toutes (${S.seances.length})</button>

    <button class="chip ${seanceFiltre==="passees"?"on":""}" onclick="seanceFiltre='passees';render()">Passées</button></div>`;

  else {
    let lastM="";
    l.forEach(s=>{ const m=new Date(s.date+"T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); if(m!==lastM){ h+=`<h2 style="text-transform:capitalize">${m}</h2>`; lastM=m;} h+=sessCard(s); });

function syncDraft(){
  const d=S.draft; if(!d) return;

}
function moveBloc(i,dir){ syncDraft(); const b=S.draft.blocs, j=i+dir; if(j<0||j>=b.length) return; [b[i],b[j]]=[b[j],b[i]]; save(); renderEditor(); }
function delBloc(i){ syncDraft(); S.draft.blocs.splice(i,1); save(); renderEditor(); }
function togglePres(id){ syncDraft(); const p=S.draft.presents, i=p.indexOf(id); i>=0?p.splice(i,1):p.push(id); save(); renderEditor(); }
function allPres(v){ syncDraft(); S.draft.presents = v? S.joueurs.map(j=>j.id):[]; save(); renderEditor(); }
function setNote(n){ syncDraft(); S.draft.note = S.draft.note===n?0:n; save(); renderEditor(); }
function saveDraft(){
  syncDraft(); const d=S.draft;
  if(!d.blocs.length && !d.comm) return toast("Ajoute au moins un exercice");
  if(!d.theme) d.theme = (exoById(d.blocs[0]?.exId)?.th[0]) || "Séance";
  if(d.id){ const i=S.seances.findIndex(s=>s.id===d.id); S.seances[i]=d; } else { d.id=uid(); S.seances.push(d); }
  S.draft=null; save(); closeSheet(true); toast("Séance enregistrée ✅"); if(tab!=="accueil") go("seances"); else render();
}
function closeEditor(){ syncDraft(); if(S.draft && S.draft.id){ S.draft=null; save(); } closeSheet(true); render(); }
function discardDraft(){ if(!confirm("Abandonner cette séance en préparation ?")) return; S.draft=null; save(); closeSheet(true); render(); }
function delSeance(){ if(!confirm("Supprimer définitivement cette séance ?")) return; S.seances=S.seances.filter(s=>s.id!==S.draft.id); S.draft=null; save(); closeSheet(true); toast("Séance supprimée"); render(); }

  <label class="f">Poste</label><select class="in" id="eP">${POSTES.map(p=>`<option value="${p}" ${j.poste===p?"selected":""}>${p||"Non défini"}</option>`).join("")}</select>
  <label class="f">Record de jongles</label><input class="in" id="eR" type="number" min="0" value="${S.records[id]||""}" placeholder="0">
  <label class="f">Notes sur le joueur</label><textarea class="in" id="eNo" rows="3" placeholder="Points forts, axes de progrès…">${esc(j.notes||"")}</textarea>
  <button class="btn full" style="margin-top:14px" id="eOk">💾 Enregistrer</button>
  <button class="btn red full" style="margin-top:10px" id="eDel">🗑️ Retirer de l'effectif</button></div>`);
  $("#eOk").onclick=()=>{ j.nom=$("#eN").value.trim()||j.nom; j.poste=$("#eP").value; j.notes=$("#eNo").value; const r=+$("#eR").value; if(r) S.records[id]=r; else delete S.records[id]; save(); closeSheet(); render(); };
  $("#eDel").onclick=()=>{ if(!confirm("Retirer "+j.nom+" de l'effectif ?")) return; S.joueurs=S.joueurs.filter(x=>x.id!==id); save(); closeSheet(); render(); };
}

// ================== RÉGLAGES ==================
$("#btnSettings").onclick=()=>{
  sheet(`<div class="grab"></div><div class="sh-head"><h3>⚙️ Réglages</h3><button class="closebtn" onclick="S.settings.vu=true;save();closeSheet()">✕</button></div>
  <div class="card"><label class="f" style="margin-top:0">Club</label><input class="in" id="sClub" value="${esc(S.settings.club)}" placeholder="Ex : US Grenay">
  <label class="f">Nom de l'équipe</label><input class="in" id="sEq" value="${esc(S.settings.equipe)}" placeholder="Ex : U11 A">
  <label class="f">Catégorie (adapte les exercices)</label><select class="in" id="sCat">${CATS.map((c,i)=>`<option value="${i}" ${S.settings.cat===i?"selected":""}>${c}</option>`).join("")}</select>
  <label class="f">Durée habituelle d'une séance</label><select class="in" id="sDur">${[45,60,75,90,105,120].map(d=>`<option value="${d}" ${S.settings.duree===d?"selected":""}>${d} min</option>`).join("")}</select>
  <button class="btn full" style="margin-top:14px" id="sOk">💾 Enregistrer</button></div>
  <h2>Sauvegarde</h2>
  <div class="card"><p class="small" style="margin-top:0">Tes données restent sur ce téléphone. Fais une sauvegarde de temps en temps pour ne rien perdre (ou pour les passer sur un autre appareil).</p>
  <div class="grid2"><button class="btn ghost" id="sExp">⬇️ Sauvegarder</button><button class="btn ghost" id="sImp">⬆️ Restaurer</button></div>
  <input type="file" id="sFile" accept=".json,application/json" hidden></div>
  <p class="small" style="text-align:center">Coach Foot · ${EXOS.length} exercices</p>`);
  $("#sOk").onclick=()=>{ S.settings.club=$("#sClub").value.trim(); S.settings.equipe=$("#sEq").value.trim()||"Mon équipe"; S.settings.cat=+$("#sCat").value; S.settings.duree=+$("#sDur").value; S.settings.vu=true; if(S.gen){S.gen.duree=S.settings.duree;} save(); closeSheet(); render(); toast("Réglages enregistrés"); };
  $("#sExp").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="coachfoot-sauvegarde-"+today()+".json"; a.click(); };
  $("#sImp").onclick=()=>$("#sFile").click();
  $("#sFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t); if(!d.seances) throw 0; if(!confirm("Remplacer les données actuelles par cette sauvegarde ?")) return; S=Object.assign(defaultState(),d); save(); closeSheet(); render(); toast("Sauvegarde restaurée ✅"); }catch(_){ toast("Fichier non reconnu"); } }); };
};

// ================== FEUILLES ==================
function sheet(html, full){ const sh=$("#sheet"); sh.className="sheet"+(full?" full":""); sh.innerHTML=html; sh.scrollTop=0; $("#ov").classList.add("show"); document.body.style.overflow="hidden"; renderDraftBar(); }
function closeSheet(){ $("#ov").classList.remove("show"); document.body.style.overflow=""; renderDraftBar(); }
$("#ov").onclick=e=>{ if(e.target.id==="ov"){ if($("#sheet").classList.contains("full")) return; closeSheet(); } };

// ================== DÉMARRAGE ==================
render();
if(!S.settings.vu){ setTimeout(()=>$("#btnSettings").click(), 400); }
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
